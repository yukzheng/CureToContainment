<!DOCTYPE html>
<html>
<head>
  <title>Archive Entry</title>

  <style>

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100vw;
      height: 100vh;
      margin: 0;
    }

    .container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .back-to-archive {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .back-to-archive:hover {
      background: rgba(0, 0, 0, 0.65);
      transform: scale(1.05);
    }

    .back-to-archive svg {
      width: 22px;
      height: 22px;
      display: block;
    }

  </style>
</head>

<body>

  <div class="container">
    <img id="entry-image" src="" alt="">
  </div>

  <a class="back-to-archive" href="archive.html" aria-label="Back to archive">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>

  <script>

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const imgParam = params.get("img");

    const entries = {

      A0112: {
        image: "IMG_0123.JPG",
        title: "RX-01-CC"
      },

      A0111: {
        image: "IMG_0122.JPG",
        title: "AN-14-FR"
      },

      A0097: {
        image: "IMG_0124.JPG",
        title: "TR-09-MX"
      },

      A0099: {
        image: "IMG_0125.JPG",
        title: "RX-01-CC"
      },

      A0104: {
        image: "IMG_0127.JPG",
        title: "TR-09-MX"
      }

    };

    const img = document.getElementById("entry-image");
    const entry = id ? entries[id] : null;
    const imageSrc = imgParam ? decodeURIComponent(imgParam) : entry ? entry.image : "";
    const title = entry ? entry.title : "";

    if (imageSrc) {
      img.src = imageSrc;
      img.alt = title;
    } else {
      img.removeAttribute("src");
      img.alt = "";
    }

  </script>

</body>
</html>
