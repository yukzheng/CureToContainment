<!DOCTYPE html>
<html lang="en">
<head>
  <title>Archive - From Cure to Containment</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Atkinson Hyperlegible', sans-serif;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /*
      Stage fills the viewport; background and PNG overlays use the same
      object-fit/object-position so pixels stay aligned for alpha hit-testing.
    */
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* FULLSCREEN BACKGROUND */
    .background {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: none;
    }

    /* HEADER */
    .header {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      padding-top: calc(clamp(32px, 5vh, 56px) + 23px);
      z-index: 10;
      pointer-events: auto;
      text-align: center;
      max-width: min(90vw, 36rem);

      color: #f2ebe3;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 64px);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #f2ebe3;
    }

    /*
      PNGs are full-frame with transparency; stack them aligned to the photo.
      pointer-events: none — clicks are handled on .container so we can pick
      the topmost opaque pixel across layers.
    */
    .entry-link {
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
      z-index: 2;
    }

    .entry-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: none;
      transform-origin: center center;
      transition: transform 0.22s ease;
    }

    /* Keep original layer order even while hovered */
    .entry-link.entry-hot {
      z-index: 2;
    }

    .entry-link.entry-hot img {
      transform: scale(1.07);
    }

  </style>
</head>

  <script>
    (function () {
      var stage = document.getElementById('archive-stage');
      if (!stage) return;

      var ALPHA_THRESHOLD = 10;

      function ensureHitCanvas(img) {
        if (img._hitCanvas && img._hitNaturalW === img.naturalWidth) return;
        if (!img.complete || !img.naturalWidth) return;
        var c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        var ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        img._hitCanvas = c;
        img._hitNaturalW = img.naturalWidth;
      }

      function hitOpaque(img, clientX, clientY) {
        try {
          ensureHitCanvas(img);
          if (!img._hitCanvas) return false;
          var rect = img.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return false;
          var x = Math.floor((clientX - rect.left) * img.naturalWidth / rect.width);
          var y = Math.floor((clientY - rect.top) * img.naturalHeight / rect.height);
          if (x < 0 || y < 0 || x >= img.naturalWidth || y >= img.naturalHeight) return false;
          var ctx = img._hitCanvas.getContext('2d', { willReadFrequently: true });
          var a = ctx.getImageData(x, y, 1, 1).data[3];
          return a >= ALPHA_THRESHOLD;
        } catch (err) {
          return false;
        }
      }

      function entryImagesTopFirst() {
        return [].slice.call(stage.querySelectorAll('.entry-link img'));
      }

      function pickAnchor(clientX, clientY) {
        var list = entryImagesTopFirst();
        for (var i = list.length - 1; i >= 0; i--) {
          var img = list[i];
          if (!hitOpaque(img, clientX, clientY)) continue;
          var anchor = img.closest('a.entry-link');
          return anchor || null;
        }
        return null;
      }

      stage.querySelectorAll('.entry-link img').forEach(function (img) {
        function refreshHitMap() {
          img._hitCanvas = null;
          ensureHitCanvas(img);
        }
        img.addEventListener('load', refreshHitMap);
        if (img.complete) refreshHitMap();
      });

      stage.addEventListener('click', function (e) {
        if (e.target.closest && e.target.closest('.header')) return;
        var picked = pickAnchor(e.clientX, e.clientY);
        if (!picked) return;
        e.preventDefault();
        window.location.href = picked.href;
      });

      stage.addEventListener('auxclick', function (e) {
        if (e.button !== 1) return;
        if (e.target.closest && e.target.closest('.header')) return;
        var picked = pickAnchor(e.clientX, e.clientY);
        if (!picked) {
          e.preventDefault();
          return;
        }
        e.preventDefault();
        window.open(picked.href, '_blank');
      });

      var lastHot = null;
      stage.addEventListener('mousemove', function (e) {
        if (e.target.closest && e.target.closest('.header')) {
          if (lastHot) lastHot.classList.remove('entry-hot');
          lastHot = null;
          stage.style.cursor = '';
          return;
        }
        var picked = pickAnchor(e.clientX, e.clientY);
        if (lastHot) lastHot.classList.remove('entry-hot');
        lastHot = picked;
        if (picked) picked.classList.add('entry-hot');
        stage.style.cursor = picked ? 'pointer' : 'default';
      });
      stage.addEventListener('mouseleave', function () {
        if (lastHot) lastHot.classList.remove('entry-hot');
        lastHot = null;
        stage.style.cursor = '';
      });
    })();
  </script>
